[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "binomial_pricer"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy", 
    "pytest", 
    "matplotlib"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]